<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>NexSearch - Legacy</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  
  <!-- Favicon stylée -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230078d4'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23ffffff' stroke-width='3'/%3E%3C/svg%3E">
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#000000;
      --panel:#0d111a;
      --border:rgba(255,255,255,0.08);
      --accent:#0078d4;
      --accent2:#4da3ff;
      --txt:#d0e2ff;
      --muted:#9cc4ff;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"Poppins",system-ui,-apple-system,sans-serif;
      background:var(--bg);
      color:var(--txt);
      overflow-x:hidden;
      min-height:100vh;
    }
    .glow {
      position: fixed;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(59,130,246,0.2), transparent 70%);
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      filter: blur(80px);
      z-index: -1;
      pointer-events: none;
    }
    #app{min-height:100vh;display:flex;flex-direction:column}
    .top-bar{
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 24px;background:rgba(0,0,0,0.8);
      border-bottom:1px solid var(--border);
      position:sticky;top:0;z-index:10;
      backdrop-filter:blur(16px);
    }
    .top-left{display:flex;align-items:center;gap:12px;cursor:pointer}
    .logo-main{
      width:28px;height:28px;border-radius:6px;
      background:linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow:0 0 12px rgba(0,120,212,0.4);
    }
    .logo-text{
      font-size:1.1rem;font-weight:600;
      background:linear-gradient(90deg,#6fa3ff,#9cc4ff);
      -webkit-background-clip:text;color:transparent;
    }
    .main-layout{
      flex:1;max-width:900px;width:100%;margin:0 auto;
      display:flex;flex-direction:column;
      gap:16px;padding:20px 16px 100px 16px;
    }
    .panel{
      background:var(--panel);border:1px solid var(--border);
      border-radius:14px;padding:18px;display:flex;flex-direction:column;
      backdrop-filter:blur(20px);
      box-shadow:0 8px 32px rgba(0,0,0,0.4);
    }
    .panel-title{font-size:1.1rem;font-weight:600;color:#fff}
    .panel-sub{font-size:0.8rem;color:var(--muted);margin-bottom:12px}
    #results-meta{font-size:.8rem;color:var(--muted);margin-bottom:8px}
    .ai-legacy-box {
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
    }
    .ai-legacy-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent2);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #results-summary {
      font-size: .9rem;
      color: var(--txt);
      line-height: 1.4;
    }
    #results-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
    .result-item-link{text-decoration:none;color:inherit;display:block}
    .result-item{
      display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;
      border:1px solid var(--border);background:rgba(255,255,255,0.02);
      transition:all 0.2s ease;
      cursor:pointer;
    }
    .result-item:hover{
      border-color:var(--accent);
      background:rgba(255,255,255,0.05);
      transform:translateY(-1px);
      box-shadow:0 4px 20px rgba(0,120,212,0.15);
    }
    .result-content{flex:1;min-width:0}
    .result-item-title{font-size:.95rem;font-weight:600;color:var(--accent2);margin-bottom:2px}
    .result-item-url{font-size:.75rem;color:var(--muted);word-break:break-all;margin-bottom:4px}
    .result-item-tags{font-size:.8rem;color:var(--txt);opacity:0.8;line-height:1.3}
    .result-favicon{
      width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,0.05);
      display:flex;align-items:center;justify-content:center;flex:none;
      overflow:hidden;border:1px solid var(--border);
    }
    .result-favicon img{width:14px;height:14px;object-fit:cover}
    .results-actions-wrapper{border-top:1px solid var(--border);padding-top:12px;margin-top:12px}
    .actions-bar{display:flex;flex-wrap:wrap;gap:8px}
    .action-btn{
      border:1px solid var(--border);background:rgba(255,255,255,0.03);color:var(--txt);
      border-radius:8px;font-size:.8rem;padding:6px 14px;cursor:pointer;
      transition:0.2s;
    }
    .action-btn:hover{border-color:var(--accent);background:rgba(0,120,212,0.1);color:#fff}
    .bottom-dock{
      position:fixed;left:0;right:0;bottom:16px;display:flex;
      justify-content:center;pointer-events:none;z-index:20;
    }
    .bottom-bar{
      width:min(700px,100% - 32px);display:flex;align-items:center;
      gap:12px;padding:8px 14px;border-radius:14px;background:rgba(13,17,26,0.85);
      border:1px solid var(--border);pointer-events:auto;
      backdrop-filter:blur(20px);
      box-shadow:0 10px 40px rgba(0,0,0,0.6);
    }
    .bottom-logo{
      width:30px;height:30px;border-radius:8px;
      background:linear-gradient(135deg, var(--accent), var(--accent2));
      cursor:pointer;flex:none;
      box-shadow:0 0 12px rgba(0,120,212,0.4);
    }
    .bottom-input{
      flex:1;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,0.4);
      border-radius:10px;border:1px solid var(--border);padding:4px 4px 4px 12px;
    }
    .bottom-input input{
      flex:1;border:none;outline:none;background:transparent;color:var(--txt);
      font-size:.95rem;font-family:"Poppins",system-ui,sans-serif;
    }
    .bottom-input input::placeholder{color:var(--muted);opacity:0.6;}
    .bottom-input button{
      border:none;border-radius:8px;background:var(--accent);color:#fff;
      font-size:.85rem;font-weight:600;padding:8px 16px;cursor:pointer;
      transition:0.2s;
    }
    .bottom-input button:hover{background:#1985da;box-shadow:0 0 15px rgba(0,120,212,0.4)}
  </style>
</head>

<body>
<div class="glow"></div>
<div id="app">

  <header class="top-bar">
    <div class="top-left" id="home-link-top">
      <div class="logo-main"></div>
      <div class="logo-text">NexSearch - Legacy</div>
    </div>
  </header>

  <main class="main-layout">
    <section class="panel">
      <div class="panel-title">Résultats de recherche</div>
      <div class="panel-sub">Propulsé par le Worker Cloudflare et l'index indépendant</div>

      <div id="results-meta"></div>

      <div class="ai-legacy-box">
        <div class="ai-legacy-title">NexAI - Legacy</div>
        <div id="results-summary">Analyse de la requête en cours...</div>
      </div>

      <div id="results-list"></div>

      <div class="results-actions-wrapper">
        <div style="font-size:.8rem;color:var(--muted);margin-bottom:6px">Actions rapides</div>
        <div id="results-actions" class="actions-bar"></div>
      </div>
    </section>
  </main>

  <div class="bottom-dock">
    <div class="bottom-bar">
      <div class="bottom-logo" id="home-link-bottom" title="Accueil"></div>
      <div class="bottom-input">
        <input id="search-input" type="text" placeholder="Rechercher...">
        <button id="search-btn">Rechercher</button>
      </div>
    </div>
  </div>

</div>

<script>
/* WORKER OBFUSQUÉ (Invisible au premier coup d'œil) */
const _0xW = "Z2V0UmVzdWx0cw=="; // Masquage interne
function getWorkerUrl(query) {
  // Décodage dynamique à l'exécution de l'URL obfusquée
  const encoded = "cz1xP2hjcmFlcy92ZWQuc2Vrcm93LXRlcnVvZy1vYXouaGNyYWVzLXl4b3JwLy86c3B0dGg=";
  const reversed = atob(encoded);
  const rawUrl = reversed.split("").reverse().join("");
  return rawUrl.replace("%s", encodeURIComponent(query));
}

/* CALCUL */
function tryCalc(e){
  try{
    if(!/^[0-9+\-*/().,%\s]+$/.test(e))return null;
    const s=e.replace(/%/g,"/100");
    const r=Function('"use strict";return('+s+")")();
    return typeof r==="number"&&isFinite(r)?r:null;
  }catch{return null}
}

/* FETCH VIA WORKER SÉCURISÉ */
async function fetchResults(query){
  const targetUrl = getWorkerUrl(query);
  try {
    const resp = await fetch(targetUrl);
    const data = await resp.json();
    if(data && data.results) {
      return data.results.slice(0,15).map(r => ({
        title: r.title || r.url,
        url: r.url,
        desc: r.description || "",
        favicon: "https://www.google.com/s2/favicons?domain=" + new URL(r.url).hostname
      }));
    }
  } catch(e) {
    console.warn("Erreur Worker direct, bascule de secours:", e);
  }

  // Fallback Mojeek si besoin
  const fallbackUrl = "https://www.mojeek.com/api/search?q=" + encodeURIComponent(query);
  const respFallback = await fetch(fallbackUrl);
  const dataFallback = await respFallback.json();

  if(!dataFallback.results) return [];

  return dataFallback.results.slice(0,15).map(r => ({
    title: r.title || r.url,
    url: r.url,
    desc: r.description || "",
    favicon: "https://www.google.com/s2/favicons?domain=" + new URL(r.url).hostname
  }));
}

/* RENDER RESULTS */
function renderResults(query, results){
  const list = document.getElementById("results-list");
  list.innerHTML = "";

  results.forEach(r=>{
    const a = document.createElement("a");
    a.href = r.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.className = "result-item-link";

    const item = document.createElement("div");
    item.className = "result-item";

    const content = document.createElement("div");
    content.className = "result-content";

    const title = document.createElement("div");
    title.className = "result-item-title";
    title.textContent = r.title;

    const url = document.createElement("div");
    url.className = "result-item-url";
    url.textContent = r.url;

    const tags = document.createElement("div");
    tags.className = "result-item-tags";
    tags.textContent = r.desc || "Résultat pertinent indexé par le moteur.";

    content.appendChild(title);
    content.appendChild(url);
    content.appendChild(tags);

    const fav = document.createElement("div");
    fav.className = "result-favicon";
    const img = document.createElement("img");
    img.src = r.favicon;
    img.onerror = () => { img.style.display = 'none'; };
    fav.appendChild(img);

    item.appendChild(content);
    item.appendChild(fav);
    a.appendChild(item);
    list.appendChild(a);
  });
}

/* META & ACTIONS */
function renderMeta(query, results){
  const meta = document.getElementById("results-meta");
  if(!query.trim()){
    meta.textContent = "Aucune requête active.";
    return;
  }
  meta.textContent = `Requête : « ${query} » — ${results.length} résultats trouvés.`;
}

function renderActions(query){
  const bar = document.getElementById("results-actions");
  bar.innerHTML = "";
  if(!query.trim()) return;

  const btn = document.createElement("button");
  btn.className = "action-btn";
  btn.textContent = "Voir sur Bing ›";
  btn.onclick = ()=>window.open("https://www.bing.com/search?q="+encodeURIComponent(query),"_blank");
  bar.appendChild(btn);

  const btnGoogle = document.createElement("button");
  btnGoogle.className = "action-btn";
  btnGoogle.textContent = "Voir sur Google ›";
  btnGoogle.onclick = ()=>window.open("https://www.google.com/search?q="+encodeURIComponent(query),"_blank");
  bar.appendChild(btnGoogle);
}

function aiSummary(query, results, calc){
  if(!query.trim()) return "Tapez une requête dans la barre ci-dessous pour lancer une recherche.";
  if(calc!==null) return `Calcul mathématique détecté. Résultat : ${calc}.`;
  if(!results.length) return `Aucun résultat pertinent trouvé pour « ${query} ».`;

  return `NexAI - Legacy a analysé la recherche « ${query} » : ${results.length} sources principales ont été indexées et vérifiées.`;
}

/* RUN SEARCH */
async function runSearch(query){
  const q = query.trim();
  const meta = document.getElementById("results-meta");
  const summaryEl = document.getElementById("results-summary");
  const list = document.getElementById("results-list");

  if(!q){
    meta.textContent = "Aucune requête.";
    summaryEl.textContent = aiSummary("",[],null);
    list.innerHTML = "";
    document.getElementById("results-actions").innerHTML = "";
    return;
  }

  meta.textContent = "Recherche en cours...";
  summaryEl.textContent = "NexAI - Legacy analyse la requête...";
  list.innerHTML = "";

  const calc = tryCalc(q);
  let results = [];

  try{
    results = await fetchResults(q);
  }catch(e){
    summaryEl.textContent = "Erreur lors de la communication.";
  }

  renderResults(q, results);
  renderMeta(q, results);
  renderActions(q);
  summaryEl.textContent = aiSummary(q, results, calc);
}

/* UI SETUP */
function setupUI(){
  const homeTop=document.getElementById("home-link-top");
  const homeBottom=document.getElementById("home-link-bottom");
  const searchInput=document.getElementById("search-input");
  const searchBtn=document.getElementById("search-btn");

  homeTop.onclick=()=>{window.location.href="./";};
  homeBottom.onclick=()=>{window.location.href="./";};

  searchBtn.onclick=()=>{
    const q=searchInput.value;
    const url=new URL(window.location.href);
    url.searchParams.set("q",q);
    history.replaceState(null,"",url.toString());
    runSearch(q);
  };

  searchInput.addEventListener("keydown",e=>{
    if(e.key==="Enter")searchBtn.click();
  });
}

window.addEventListener("load",()=>{
  setupUI();
  const p = new URLSearchParams(window.location.search);
  const initial = p.get("q") || "";
  const input=document.getElementById("search-input");
  if(initial){
    input.value=initial;
    runSearch(initial);
  } else {
    runSearch("");
  }
});
</script>

</body>
</html>
