<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>NexSearch</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <style>
    :root{
      --bg:#05060a;--panel:#0f121a;--border:#1f2937;
      --accent:#0078d4;--accent2:#4da3ff;
      --txt:#e5e7eb;--muted:#9ca3af;--soft:#6b7280;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:#05060a;color:var(--txt);overflow-x:hidden;
    }
    #app{min-height:100vh;display:flex;flex-direction:column}

    /* TOP BAR */
    .top-bar{
      display:flex;align-items:center;justify-content:space-between;
      padding:8px 14px;background:#0b0d13;border-bottom:1px solid var(--border);
      position:sticky;top:0;z-index:10;
    }
    .top-left{display:flex;align-items:center;gap:8px;cursor:pointer}
    .logo-main{
      width:26px;height:26px;border-radius:4px;background:#0f121a;
      border:1px solid #1f2937;
    }
    .logo-text{font-size:.9rem;font-weight:600}

    /* MAIN LAYOUT */
    .main-layout{
      flex:1;display:grid;grid-template-columns:minmax(0,1fr);
      gap:8px;padding:8px 10px 80px 10px;
    }

    /* PANEL */
    .panel{
      background:var(--panel);border:1px solid var(--border);
      border-radius:4px;padding:8px;display:flex;flex-direction:column;
    }
    .panel-title{font-size:.9rem;font-weight:600}
    .panel-sub{font-size:.7rem;color:var(--soft)}
    #results-meta{font-size:.75rem;color:var(--soft);margin-bottom:4px}
    #results-summary{
      margin-bottom:6px;padding:6px;border-radius:4px;background:#0b0d13;
      border:1px solid #111827;font-size:.78rem;max-height:110px;overflow-y:auto;
    }
    #results-list{flex:1;overflow-y:auto;padding-right:2px;margin-bottom:6px}

    /* RESULT ITEM */
    .result-item-link{text-decoration:none;color:inherit;display:block}
    .result-item{
      display:flex;align-items:center;gap:6px;padding:6px;border-radius:4px;
      border:1px solid #111827;background:#05060a;margin-bottom:4px;
      cursor:pointer;
    }
    .result-item:hover{border-color:var(--accent)}
    .result-content{flex:1;min-width:0}
    .result-item-title{font-size:.85rem;font-weight:600}
    .result-item-url{font-size:.7rem;color:var(--muted);word-break:break-all}
    .result-item-tags{font-size:.68rem;color:var(--soft)}
    .result-favicon{
      width:18px;height:18px;border-radius:4px;background:#0f121a;
      display:flex;align-items:center;justify-content:center;margin-left:auto;
      overflow:hidden;
    }
    .result-favicon img{width:100%;height:100%;object-fit:cover}

    /* ACTIONS */
    .results-actions-wrapper{border-top:1px solid #111827;padding-top:4px}
    .actions-bar{display:flex;flex-wrap:wrap;gap:4px}
    .action-btn{
      border:1px solid var(--border);background:#05060a;color:var(--txt);
      border-radius:4px;font-size:.7rem;padding:3px 8px;cursor:pointer;
    }
    .action-btn:hover{border-color:var(--accent)}

    /* BOTTOM BAR */
    .bottom-dock{
      position:fixed;left:0;right:0;bottom:8px;display:flex;
      justify-content:center;pointer-events:none;z-index:20;
    }
    .bottom-bar{
      width:min(880px,100% - 16px);display:flex;align-items:center;
      gap:8px;padding:6px 10px;border-radius:4px;background:#0b0d13;
      border:1px solid var(--border);pointer-events:auto;
    }
    .bottom-logo{
      width:24px;height:24px;border-radius:4px;background:#0f121a;
      border:1px solid #1f2937;cursor:pointer;
    }
    .bottom-input{
      flex:1;display:flex;align-items:center;gap:6px;background:#05060a;
      border-radius:4px;border:1px solid #111827;padding:3px 6px;
    }
    .bottom-input input{
      flex:1;border:none;outline:none;background:transparent;color:var(--txt);
      font-size:.8rem;
    }
    .bottom-input button{
      border:none;border-radius:4px;background:var(--accent);color:#f9fafb;
      font-size:.78rem;padding:4px 10px;cursor:pointer;
    }
  </style>
</head>

<body>
<div id="app">

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="top-left" id="home-link-top">
      <div class="logo-main"></div>
      <div class="logo-text">NexSearch</div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main-layout">
    <section class="panel">
      <div class="panel-title">Résultats</div>
      <div class="panel-sub">Moteur indépendant – liens directs</div>

      <div id="results-meta"></div>
      <div id="results-summary"></div>
      <div id="results-list"></div>

      <div class="results-actions-wrapper">
        <div style="font-size:.7rem;color:#9ca3af;margin-bottom:2px">Actions rapides</div>
        <div id="results-actions" class="actions-bar"></div>
      </div>
    </section>
  </main>

  <!-- BOTTOM BAR -->
  <div class="bottom-dock">
    <div class="bottom-bar">
      <div class="bottom-logo" id="home-link-bottom"></div>
      <div class="bottom-input">
        <input id="search-input" type="text" placeholder="Rechercher...">
        <button id="search-btn">Rechercher</button>
      </div>
    </div>
  </div>

</div>

<script>
/* NORMALISATION */
function nrm(s){
  return s.toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9 ]+/g," ")
    .replace(/\s+/g," ")
    .trim();
}

/* CALCUL */
function tryCalc(e){
  try{
    if(!/^[0-9+\-*/().,%\s]+$/.test(e))return null;
    const s=e.replace(/%/g,"/100");
    const r=Function('"use strict";return('+s+")")();
    return typeof r==="number"&&isFinite(r)?r:null;
  }catch{return null}
}

/* API MOJEEK – SANS CLÉ */
async function fetchResults(query){
  const url = "https://www.mojeek.com/api/search?q=" + encodeURIComponent(query);
  const resp = await fetch(url);
  const data = await resp.json();

  if(!data.results) return [];

  return data.results.slice(0,15).map(r => ({
    title: r.title || r.url,
    url: r.url,
    desc: r.description || "",
    favicon: "https://www.google.com/s2/favicons?domain=" + new URL(r.url).hostname
  }));
}

/* RENDER RESULTS */
function renderResults(query, results){
  const list = document.getElementById("results-list");
  list.innerHTML = "";

  results.forEach(r=>{
    const a = document.createElement("a");
    a.href = r.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.className = "result-item-link";

    const item = document.createElement("div");
    item.className = "result-item";

    const content = document.createElement("div");
    content.className = "result-content";

    const title = document.createElement("div");
    title.className = "result-item-title";
    title.textContent = r.title;

    const url = document.createElement("div");
    url.className = "result-item-url";
    url.textContent = r.url;

    const tags = document.createElement("div");
    tags.className = "result-item-tags";
    tags.textContent = r.desc || "Résultat pertinent";

    content.appendChild(title);
    content.appendChild(url);
    content.appendChild(tags);

    const fav = document.createElement("div");
    fav.className = "result-favicon";
    const img = document.createElement("img");
    img.src = r.favicon;
    fav.appendChild(img);

    item.appendChild(content);
    item.appendChild(fav);
    a.appendChild(item);
    list.appendChild(a);
  });
}

/* META */
function renderMeta(query, results){
  const meta = document.getElementById("results-meta");
  if(!query.trim()){
    meta.textContent = "Aucune requête.";
    return;
  }
  meta.textContent = "Requête : « "+query+" » — "+results.length+" résultats.";
}

/* ACTIONS RAPIDES */
function renderActions(query){
  const bar = document.getElementById("results-actions");
  bar.innerHTML = "";

  if(!query.trim()) return;

  const btn = document.createElement("button");
  btn.className = "action-btn";
  btn.textContent = "Voir sur Bing";
  btn.onclick = ()=>window.open("https://www.bing.com/search?q="+encodeURIComponent(query),"_blank");
  bar.appendChild(btn);
}

/* SUMMARY */
function aiSummary(query, results, calc){
  if(!query.trim()) return "Tapez une requête pour commencer.";
  if(calc!==null) return "Résultat du calcul : "+calc+".";
  if(!results.length) return "Aucun résultat trouvé.";

  return "Résultats trouvés pour « "+query+" ».";
}

/* RUN SEARCH */
async function runSearch(query){
  const q = query.trim();
  const meta = document.getElementById("results-meta");
  const summaryEl = document.getElementById("results-summary");
  const list = document.getElementById("results-list");

  if(!q){
    meta.textContent = "Aucune requête.";
    summaryEl.textContent = aiSummary("",[],null);
    list.innerHTML = "";
    document.getElementById("results-actions").innerHTML = "";
    return;
  }

  meta.textContent = "Recherche en cours...";
  summaryEl.textContent = "Analyse de la requête...";
  list.innerHTML = "";

  const calc = tryCalc(q);
  let results = [];

  try{
    results = await fetchResults(q);
  }catch(e){
    summaryEl.textContent = "Erreur lors de la récupération des résultats.";
  }

  renderResults(q, results);
  renderMeta(q, results);
  renderActions(q);
  summaryEl.textContent = aiSummary(q, results, calc);
}

/* UI */
function setupUI(){
  const homeTop=document.getElementById("home-link-top");
  const homeBottom=document.getElementById("home-link-bottom");
  const searchInput=document.getElementById("search-input");
  const searchBtn=document.getElementById("search-btn");

  homeTop.onclick=()=>{window.location.href="./";};
  homeBottom.onclick=()=>{window.location.href="./";};

  searchBtn.onclick=()=>{
    const q=searchInput.value;
    const url=new URL(window.location.href);
    url.searchParams.set("q",q);
    history.replaceState(null,"",url.toString());
    runSearch(q);
  };

  searchInput.addEventListener("keydown",e=>{
    if(e.key==="Enter")searchBtn.click();
  });
}

/* INIT */
window.addEventListener("load",()=>{
  setupUI();
  const p = new URLSearchParams(window.location.search);
  const initial = p.get("q") || "";
  const input=document.getElementById("search-input");
  if(initial){
    input.value=initial;
    runSearch(initial);
  }
});
</script>

</body>
</html>
